[project]
name = "threadline"
version = "0.1.0"
description = "Security knowledge graph and GraphRAG on Neo4j"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "neo4j>=6.4",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[project.scripts]
threadline = "threadline.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threadline"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a Neo4j instance (set NEO4J_TEST_URI)"]
